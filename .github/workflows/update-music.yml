name: Update Live Music Listing

on:
  schedule:
    - cron: '0 13 * * 1'   # Every Monday at 1pm UTC (9am ET)
  workflow_dispatch:         # Also allows manual "Run workflow" from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MUSIC_UPDATE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push if changed
        run: |
          git config user.name  "SES Music Bot"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.MUSIC_UPDATE_TOKEN }}@github.com/${{ github.repository }}.git
          git add events.json
          if git diff --staged --quiet; then
            echo "No new events found — nothing to commit."
          else
            git commit -m "Auto-update live music $(date +%Y-%m-%d)"
            git push
          fi
