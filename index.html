<title>Live Music — South East Seneca</title>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Georgia',serif;background:#4E6D77;color:#f5deb3}
  .widget{max-width:960px;margin:0 auto;padding:0 20px 40px}
  .header{background:#1D272B;text-align:center;padding:28px 20px 22px;margin-bottom:28px}
  .header-eyebrow{font-family:'Antonio',sans-serif;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#f5deb3;margin-bottom:4px}
  .header-title{font-family:'Antonio',sans-serif;font-size:52px;font-weight:700;color:#e8aa4a;letter-spacing:.04em;text-transform:uppercase;line-height:1}
  .header-sub{font-family:'Antonio',sans-serif;font-size:13px;color:#f5deb3;margin-top:6px;letter-spacing:.1em;text-transform:uppercase}
  .header-rule{width:120px;height:1px;background:#c9a96e;margin:12px auto 0}
  .week-section{margin-bottom:12px;border-radius:10px;overflow:hidden}
  .week-toggle{width:100%;background:#1D272B;border:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:#f5deb3;font-family:'Antonio',sans-serif;font-size:16px;letter-spacing:.08em;text-transform:uppercase;transition:background 0.2s}
  .week-toggle:hover{background:#263035}
  .week-toggle.current{background:#e8aa4a;color:#1D272B}
  .week-toggle.current:hover{background:#d9993b}
  .week-badge{font-family:'Antonio',sans-serif;font-size:11px;letter-spacing:.1em;padding:3px 10px;border-radius:20px;text-transform:uppercase}
  .week-toggle.current .week-badge{background:#1D272B;color:#e8aa4a}
  .week-toggle:not(.current) .week-badge{background:#e8aa4a22;color:#e8aa4a}
  .week-toggle .chevron{font-size:14px;transition:transform 0.2s}
  .week-toggle.open .chevron{transform:rotate(180deg)}
  .week-content{display:none;background:#4E6D77;padding:16px 0}
  .week-content.open{display:block}
  .days-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:0 12px}
  .day-card{background:#323D41;border-radius:8px;overflow:hidden;border:1px solid #4a5a60}
  .day-header{background:#e8aa4a;padding:7px 14px;display:flex;justify-content:space-between;align-items:center}
  .day-name{font-family:'Antonio',sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#1D272B}
  .day-date-lbl{font-family:'Antonio',sans-serif;font-size:11px;color:#1D272B;opacity:0.7}
  .events-list{padding:10px 14px;display:flex;flex-direction:column;gap:9px}
  .event-item{display:flex;align-items:center;gap:10px}
  .logo-box{width:38px;height:38px;border-radius:6px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:3px}
  .logo-box img{width:100%;height:100%;object-fit:contain}
  .logo-initials{width:38px;height:38px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Antonio',sans-serif;font-size:12px;font-weight:700;letter-spacing:.05em}
  .event-info{flex:1;border-left:2px solid #6b8a8a;padding-left:9px}
  .event-venue a{font-family:'Antonio',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#e8aa4a;text-decoration:none}
  .event-venue a:hover{color:#f5deb3;text-decoration:underline}
  .event-artist{font-family:'Georgia',serif;font-size:13px;color:#f5deb3;line-height:1.3;margin-top:1px}
  .event-time{font-family:'Antonio',sans-serif;font-size:10px;color:#9b7b5a;margin-top:1px}
  .event-link{font-family:'Antonio',sans-serif;font-size:10px;color:#6b8a8a;text-decoration:none;white-space:nowrap;flex-shrink:0}
  .event-link:hover{color:#e8aa4a}
  .past-toggle-btn{display:block;width:100%;text-align:center;background:none;border:1px solid #4a5a60;border-radius:8px;color:#9b7b5a;font-family:'Antonio',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:10px;cursor:pointer;margin-bottom:16px}
  .past-toggle-btn:hover{color:#e8aa4a;border-color:#e8aa4a}
  .footer{text-align:center;margin-top:24px;font-family:'Antonio',sans-serif;font-size:11px;color:#4a6470;letter-spacing:.08em;text-transform:uppercase}
  .footer a{color:#6b8a8a;text-decoration:none}
  .footer a:hover{color:#e8aa4a}
  @media(max-width:600px){.header-title{font-size:36px}.days-grid{grid-template-columns:1fr}}
</style>
</head>
<script>
function postHeight() {
  parent.postMessage({type: 'musicWidgetHeight',
    height: document.documentElement.scrollHeight}, '*');
}
new ResizeObserver(postHeight).observe(document.body);
window.addEventListener('load', postHeight);
</script>

const DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];

function getMonday(d){const date=new Date(d);const day=date.getDay();const diff=day===0?-6:1-day;date.setDate(date.getDate()+diff);return date}
function fmtDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function weekLabel(mon){const sun=new Date(mon);sun.setDate(sun.getDate()+6);const m1=MONTH_NAMES[mon.getMonth()],m2=MONTH_NAMES[sun.getMonth()];return m1===m2?`${m1} ${mon.getDate()}–${sun.getDate()}`:`${m1} ${mon.getDate()} – ${m2} ${sun.getDate()}`}

function logoEl(venue){
  const L=LOGOS[venue];
  if(!L) return `<div class="logo-initials" style="background:#3a3a3a;color:#f5deb3">${venue.charAt(0)}</div>`;
  if(L.url){
    const fb=`this.parentElement.outerHTML='<div class=\\'logo-initials\\' style=\\'background:${L.bg};color:${L.fg}\\'>${L.abbr}</div>'`;
    return `<div class="logo-box" style="background:${L.bg}"><img src="${L.url}" alt="${venue}" loading="lazy" onerror="${fb}"></div>`;
  }
  return `<div class="logo-initials" style="background:${L.bg};color:${L.fg}">${L.abbr}</div>`;
}

function buildPage(){
  const today=new Date();today.setHours(0,0,0,0);
  const currentMonday=getMonday(today);
  const weeks={};
  EVENTS.forEach(e=>{
    const d=fmtDate(e.date);
    const mon=getMonday(d);
    const key=mon.toISOString().split('T')[0];
    if(!weeks[key])weeks[key]={monday:mon,events:[]};
    weeks[key].events.push({...e,dateObj:d});
  });
  const sortedWeeks=Object.keys(weeks).sort();
  const container=document.getElementById('weeks-container');
  sortedWeeks.forEach(key=>{
    const week=weeks[key];
    const isPast=week.monday<currentMonday;
    const isCurrent=week.monday.getTime()===currentMonday.getTime();
    const label=weekLabel(week.monday);
    const section=document.createElement('div');
    section.className='week-section'+(isPast?' past-section':'');
    if(isPast)section.style.display='none';
    const badge=isCurrent?'<span class="week-badge">This Week</span>':'';
    const tClass=`week-toggle${isCurrent?' current':''}${isCurrent?' open':''}`;
    section.innerHTML=`<button class="${tClass}" onclick="toggleWeek(this)"><span>Week of ${label}</span><span style="display:flex;align-items:center;gap:8px">${badge}<span class="chevron">▾</span></span></button><div class="week-content${isCurrent?' open':''}"><div class="days-grid" id="grid-${key}"></div></div>`;
    container.appendChild(section);
    const byDay={};
    week.events.forEach(e=>{if(!byDay[e.date])byDay[e.date]=[];byDay[e.date].push(e)});
    const grid=section.querySelector(`#grid-${key}`);
    Object.keys(byDay).sort().forEach(dk=>{
      const d=fmtDate(dk);
      const card=document.createElement('div');
      card.className='day-card';
      const evHtml=byDay[dk].map(e=>`<div class="event-item">${logoEl(e.venue)}<div class="event-info"><div class="event-venue"><a href="${e.url}" target="_blank">${e.venue}</a></div><div class="event-artist">${e.artist}</div><div class="event-time">${e.time}</div></div><a class="event-link" href="${e.url}" target="_blank">→</a></div>`).join('');
      card.innerHTML=`<div class="day-header"><span class="day-name">${DAY_NAMES[d.getDay()]}</span><span class="day-date-lbl">${MONTH_NAMES[d.getMonth()]} ${d.getDate()}</span></div><div class="events-list">${evHtml}</div>`;
      grid.appendChild(card);
    });
  });
}

function toggleWeek(btn){const c=btn.nextElementSibling;const o=c.classList.contains('open');c.classList.toggle('open',!o);btn.classList.toggle('open',!o)}
let pastShown=false;
function togglePast(){pastShown=!pastShown;document.querySelectorAll('.past-section').forEach(s=>s.style.display=pastShown?'block':'none');document.getElementById('pastBtn').textContent=pastShown?'▾ Hide past weeks':'▸ Show past weeks'}
buildPage();
</script>
</body>
</html>
